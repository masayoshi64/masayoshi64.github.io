  en: I received my M.S. from the Department of Mathematical Informatics, Graduate School of Information Science and Technology, The University of Tokyo. I am currently a Research Engineer at LY Corporation, working on privacy-enhancing technologies such as differential privacy and federated learning, as well as the theory of machine learning.

